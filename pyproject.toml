[project]
name = "genai_flask_app"
version = "0.1.0"
description = "ibm task"
readme = "README.md"
authors = [
    { name = "Bruno Carpio", email = "bcarpio181@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "dotenv>=0.9.9",
    "flask>=3.1.3",
    "ibm-watsonx-ai>=1.7.2",
    "langchain-core>=1.6.4",
    "langchain-ibm>=1.1.0",
]

[project.scripts]
genai = "genai_flask_app:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"
