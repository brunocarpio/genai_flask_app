{% extends "base.html" %}
{% block title %}Edit Agent{% endblock %}
{% block content %}

<h2>Edit Agent</h2>

<form method="post" autocomplete="on">
  <label for="name">Name</label>
  <input type="text" name="name" minlength="1" maxlength="100" value="{{ agent.name }}" required>

  <label for="system">System Prompt</label>
  <textarea id="system" name="system" rows="30" spellcheck="true" required>{{ agent.system }}</textarea>

  <button type="submit">Update</button>
  <a href="{{ url_for('index') }}">Cancel</a>
</form>

{% endblock %}
